name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments need id-token; contents stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines VITE_* at build time, so these have to be present here —
      # there is no runtime config to set on a static Pages site. Both values
      # are public-safe by design: they ship inside the bundle either way, and
      # Row-Level Security is what actually protects the data. The service_role
      # key must never appear in this file.
      #
      # Without them the build still succeeds and the app shows its "not
      # connected to a backend" screen rather than failing at load.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The default timeout is 10 minutes, which aborted a deployment that had
      # reached `deployment_in_progress` and was still going. Aborting also
      # cancels the deployment for that commit, so the retry inherits a
      # cancelled one and fails faster the next time — the failure feeds itself.
      # Twenty minutes is cheap; a build that genuinely hangs still ends.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
